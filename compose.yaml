services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
      POSTGRES_DB: ${POSTGRES_DB:-orderdesk}
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-orderdesk}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      OPS_APP_ORIGIN: ${OPS_APP_ORIGIN:-http://localhost:3001}
      TUNNEL_APP_ORIGIN: ${TUNNEL_APP_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-true}
      MOBILE_LOGIN_SKIP_OTP: ${MOBILE_LOGIN_SKIP_OTP:-false}
      ROUTING_API_URL: ${ROUTING_API_URL:-}
      GEOCODER_URL: ${GEOCODER_URL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set a demo-only password}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    command:
      - sh
      - -c
      - |
        set -e
        alembic upgrade head
        if [ "$$DEMO_MODE" = true ]; then python -m app.seed; fi
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
        NEXT_PUBLIC_MAP_ATTRIBUTION: ${NEXT_PUBLIC_MAP_ATTRIBUTION:-}
    environment:
      API_INTERNAL_URL: http://api:8000
      ORDERDESK_SITE: customer
      CUSTOMER_SITE_URL: ${CUSTOMER_SITE_URL:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
  operations:
    build:
      context: ./operations
      args:
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
        NEXT_PUBLIC_MAP_ATTRIBUTION: ${NEXT_PUBLIC_MAP_ATTRIBUTION:-}
    environment:
      API_INTERNAL_URL: http://api:8000
      ORDERDESK_SITE: operations
      CUSTOMER_SITE_URL: ${CUSTOMER_SITE_URL:-http://localhost:3000}
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [api]
volumes:
  pgdata:
